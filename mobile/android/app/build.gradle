plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace = 'com.rexvane.inkhole'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = '27.2.12479018'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = 'com.rexvane.inkhole'
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    sourceSets {
        main.jniLibs.srcDirs += ['../../native/android']
    }

    def releaseKeystorePath = System.getenv('INKHOLE_KEYSTORE_PATH')
    def releaseKeystorePassword = System.getenv('INKHOLE_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('INKHOLE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('INKHOLE_KEY_PASSWORD')
    def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword,
    ].every { value -> value != null && !value.trim().isEmpty() }
    def allowDebugReleaseSigning = project.findProperty('inkholeAllowDebugSigning') == 'true'

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                // Debug signing is only allowed for explicitly requested local/CI artifacts.
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = false
            shrinkResources = false
        }
    }

    gradle.taskGraph.whenReady { graph ->
        def runsReleaseTask = graph.allTasks.any { task ->
            task.project == project && task.name.contains('Release')
        }
        if (runsReleaseTask && !hasReleaseSigning && !allowDebugReleaseSigning) {
            throw new GradleException(
                'Release signing is not configured. Provide INKHOLE_KEYSTORE_PATH, '
                    + 'INKHOLE_KEYSTORE_PASSWORD, INKHOLE_KEY_ALIAS and INKHOLE_KEY_PASSWORD.'
            )
        }
    }
}
flutter {
    source = '../..'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 一次性短码扫码，沿用 v1.7.3 的 zxing 组合。
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
