<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>墨洞</title>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent; overflow: hidden;
            width: 100%; height: 100%;
        }
        body { user-select: none; }
        #petTarget { position: relative; width: 100%; height: 100%; }
        #hole { width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
        #petTarget.file-drop-target-active #hole { cursor: copy; }
        #petStatus {
            position: absolute; top: 2px; left: 50%; max-width: calc(100% - 12px);
            box-sizing: border-box; transform: translateX(-50%); padding: 3px 7px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: #d8fff8; background: rgba(10, 18, 16, .85);
            border: 1px solid rgba(88, 230, 200, .25); border-radius: 999px;
            font: 10px/1.3 -apple-system, "PingFang SC", sans-serif;
            text-align: center; pointer-events: none; z-index: 7;
        }
        #petStatus:empty { display: none; }
    </style>
</head>
<body>
<div id="petTarget" data-file-drop-target>
    <canvas id="hole"></canvas>
    <div id="petStatus"></div>
</div>
<script type="module" src="/src/pet.ts"></script>
</body>
</html>
