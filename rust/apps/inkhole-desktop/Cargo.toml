[package]
name = "inkhole-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
hex.workspace = true
inkhole-core = { path = "../../crates/inkhole-core" }
keyring = "4.1.5"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2.workspace = true
uuid.workspace = true
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tempfile = "3.23.0"
