name: Flutter Android APK

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag to which APKs should be uploaded
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'rust/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

env:
  EXPECTED_RELEASE_CERT_SHA256: efcb56c58fb2b7d91120c7a810a04da672e0873f80c1b40cf376a84035bf7023

jobs:
  build:
    if: ${{ inputs.release_tag != '' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      RELEASE_TAG: ${{ inputs.release_tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - name: Export Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Flutter host metadata
        run: flutter create --platforms=android --org com.rexvane --project-name inkhole_mobile --no-pub .

      - name: Remove generated Kotlin DSL duplicates
        shell: bash
        run: |
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts
          rm -f android/app/src/main/kotlin/com/rexvane/inkhole_mobile/MainActivity.kt

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Build Rust Android libraries
        run: bash tool/build_native.sh

      - name: Prepare trusted signing
        id: signing
        if: env.RELEASE_TAG != '' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              missing+=("$value")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            if [ -n "$RELEASE_TAG" ]; then
              printf 'Missing required Android signing secret: %s\n' "${missing[*]}" >&2
              exit 1
            fi
            echo "::warning::Trusted signing is unavailable; this CI-only artifact cannot update release installs."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/inkhole-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          {
            echo "INKHOLE_KEYSTORE_PATH=$keystore"
            echo "INKHOLE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "INKHOLE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "INKHOLE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build split APKs
        env:
          ORG_GRADLE_PROJECT_inkholeAllowDebugSigning: ${{ steps.signing.outputs.signed != 'true' && env.RELEASE_TAG == '' && 'true' || 'false' }}
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split release APKs were produced" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x |
            sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Unable to locate Android apksigner" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            actual="$("$apksigner" verify --print-certs "$apk" |
              awk -F ': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2); exit }')"
            if [ -z "$actual" ]; then
              echo "Unable to read signing certificate from $apk" >&2
              exit 1
            fi
            if [ "${{ steps.signing.outputs.signed }}" = "true" ] &&
               [ "$actual" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
              echo "Unexpected release certificate for $apk: $actual" >&2
              exit 1
            fi
            echo "$apk certificate SHA-256: $actual"
          done

      - name: Upload workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: inkhole-android-apks-${{ steps.signing.outputs.signed == 'true' && 'release-signed' || 'debug-signed' }}
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs to release
        if: env.RELEASE_TAG != '' && steps.signing.outputs.signed == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outdir=mobile/build/app/outputs/flutter-apk
          for apk in "$outdir"/app-*-release.apk; do
            [ -e "$apk" ] || continue
            name="$(basename "$apk")"
            abi="${name#app-}"
            abi="${abi%-release.apk}"
            # 未按 ABI 拆分的通用包(app-release.apk)不参与发布
            case "$abi" in *.apk | "") continue ;; esac
            target="$outdir/InkHole-$RELEASE_TAG-$abi.apk"
            cp "$apk" "$target"
            gh release upload "$RELEASE_TAG" "$target" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            # arm64-v8a 额外发布为稳定别名,供旧版应用内更新器下载
            if [ "$abi" = "arm64-v8a" ]; then
              alias_target="$outdir/InkHole-$RELEASE_TAG.apk"
              cp "$apk" "$alias_target"
              gh release upload "$RELEASE_TAG" "$alias_target" \
                --clobber \
                --repo "$GITHUB_REPOSITORY"
            fi
          done
