name: Android APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - "transport-core/**"
      - ".github/workflows/android.yml"

# Branch pushes validate Android independently. The Package workflow reuses this
# workflow for tags and publishes all three platforms only after every job passes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: transport-core/go.mod
          cache-dependency-path: transport-core/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build shared transport AAR
        working-directory: transport-core
        run: |
          make init-gomobile
          make build-android

      # 有发布签名 secret 时解出 keystore,构建固定签名的 release APK;
      # 否则(如 fork 无 secret)回退 debug 包,保证 CI 仍能跑通。
      - name: Decode release keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/inkhole-release.jks"
            echo "path=$RUNNER_TEMP/inkhole-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and lint Android
        run: gradle testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "v$APP_VERSION" = "${GITHUB_REF##*/}" || {
            echo "Tag ${GITHUB_REF##*/} does not match Android version v$APP_VERSION" >&2
            exit 1
          }

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "${{ steps.keystore.outputs.signed }}" != "yes" ]]; then
            echo "Release tags require the fixed Android release keystore" >&2
            exit 1
          fi
          if [ "${{ steps.keystore.outputs.signed }}" = "yes" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # Use an ASCII name (InkHole-<ver>.apk): Release assets do not support
      # non-ASCII filenames. On tag push use the tag, otherwise the versionName.
      - name: Rename APK
        run: |
          REF="${GITHUB_REF##*/}"
          case "$REF" in
            v*) VER="$REF" ;;
            *) VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)" ;;
          esac
          test -n "$VER"
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.signed }}" = "yes" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$SRC" "dist/InkHole-${VER}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkhole-android-apk
          path: android/dist/*.apk
