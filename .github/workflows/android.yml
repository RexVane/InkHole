name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
    tags:
      - "v*"

# Publish APK to the matching Release on v* tag push
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Use an ASCII name (InkHole-<ver>.apk): Release assets do not support
      # non-ASCII filenames. On tag push use the tag, otherwise the versionName.
      # gradle's default output is app-debug.apk.
      - name: Rename APK
        run: |
          REF="${GITHUB_REF##*/}"
          case "$REF" in
            v*) VER="$REF" ;;
            *) VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)" ;;
          esac
          test -n "$VER"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/InkHole-${VER}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkhole-android-apk
          path: android/dist/*.apk

      # Publish APK to the Release only on tag push
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
          fail_on_unmatched_files: true
