name: Flutter Android APK

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag to which APKs should be uploaded
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'rust/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      RELEASE_TAG: ${{ inputs.release_tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.0'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'

      - name: Export Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Generate Flutter host metadata
        run: flutter create --platforms=android --org com.rexvane --project-name inkhole_mobile --no-pub .

      - name: Remove generated Kotlin DSL duplicates
        shell: bash
        run: |
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts
          rm -f android/app/src/main/kotlin/com/rexvane/inkhole_mobile/MainActivity.kt

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Build Rust Android libraries
        run: bash tool/build_native.sh

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: inkhole-android-apks
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs to release
        if: env.RELEASE_TAG != ''
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outdir=mobile/build/app/outputs/flutter-apk
          for apk in "$outdir"/app-*-release.apk; do
            [ -e "$apk" ] || continue
            name="$(basename "$apk")"
            abi="${name#app-}"
            abi="${abi%-release.apk}"
            # 未按 ABI 拆分的通用包(app-release.apk)不参与发布
            case "$abi" in *.apk | "") continue ;; esac
            target="$outdir/InkHole-$RELEASE_TAG-$abi.apk"
            cp "$apk" "$target"
            gh release upload "$RELEASE_TAG" "$target" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            # arm64-v8a 额外发布为稳定别名,供旧版应用内更新器下载
            if [ "$abi" = "arm64-v8a" ]; then
              alias_target="$outdir/InkHole-$RELEASE_TAG.apk"
              cp "$apk" "$alias_target"
              gh release upload "$RELEASE_TAG" "$alias_target" \
                --clobber \
                --repo "$GITHUB_REPOSITORY"
            fi
          done
