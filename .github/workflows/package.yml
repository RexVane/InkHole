name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "InkHole $RELEASE_TAG"

  android:
    needs: prepare-release
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    secrets: inherit

  ios:
    needs: prepare-release
    uses: ./.github/workflows/ios.yml
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    secrets: inherit

  publish:
    needs: [android, ios]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: InkHole ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
