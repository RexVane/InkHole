name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# A tag becomes a Release only after Windows, macOS and Android all pass.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: inkhole-pet-windows
            asset: packaging/dist/InkHolePet-windows.zip
            manifest: packaging/dist/InkHolePet-windows.zip.sha256.ps1
          - os: macos-latest
            artifact: inkhole-pet-macos
            asset: packaging/dist/InkHolePet-macos.zip
            manifest: packaging/dist/InkHolePet-macos.zip.sha256

    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: transport-core/go.mod
          cache-dependency-path: transport-core/go.sum

      - name: Validate desktop release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PACKAGE_VERSION="$(PYTHONPATH=src python -c 'import inkhole; print(inkhole.__version__)')"
          test "$PROJECT_VERSION" = "$PACKAGE_VERSION"
          test "v$PROJECT_VERSION" = "${GITHUB_REF##*/}" || {
            echo "Tag ${GITHUB_REF##*/} does not match desktop version v$PROJECT_VERSION" >&2
            exit 1
          }

      - name: Require Windows signing credentials for releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test -n "$WINDOWS_CERTIFICATE_BASE64" && test -n "$WINDOWS_CERTIFICATE_PASSWORD"

      - name: Require Apple signing credentials for releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Install dependencies
        run: |
          pip install PySide6 zeroconf cryptography psutil keyring "qrcode[pil]" pyinstaller
          pip install pyobjc-framework-Cocoa || true

      - name: Build shared transport core
        working-directory: transport-core
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -ldflags="-s -w" -o bin/inkhole-core.exe ./cmd/inkhole-core
          else
            go build -trimpath -ldflags="-s -w" -o bin/inkhole-core ./cmd/inkhole-core
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/inkhole-signing.p12"
          keychain_path="$RUNNER_TEMP/inkhole-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          echo "INKHOLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build
        working-directory: packaging
        run: pyinstaller inkhole-pet.spec --noconfirm --clean

      - name: Sign Windows executables
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "inkhole-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $targets = @(
            "packaging\dist\InkHolePet\InkHolePet.exe"
          ) + @(Get-ChildItem "packaging\dist\InkHolePet" -Recurse -Filter "inkhole-core.exe" |
            ForEach-Object FullName)
          foreach ($target in $targets | Select-Object -Unique) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $target" }
            & $signtool.FullName verify /pa /all $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $target" }
          }
          Remove-Item -Force $pfx

      - name: Sign macOS app
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          codesign --force --deep --options runtime --timestamp \
            --keychain "$INKHOLE_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" packaging/dist/InkHolePet.app
          codesign --verify --deep --strict --verbose=2 packaging/dist/InkHolePet.app

      - name: Notarize and staple macOS app
        if: >-
          runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != '' &&
          env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          ditto -c -k --keepParent packaging/dist/InkHolePet.app "$RUNNER_TEMP/InkHolePet-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/InkHolePet-notary.zip" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple packaging/dist/InkHolePet.app
          xcrun stapler validate packaging/dist/InkHolePet.app
          spctl --assess --type execute --verbose=4 packaging/dist/InkHolePet.app

      # Windows: onedir 产物是文件夹，zip 打包后上传
      # 用户解压后双击 InkHolePet\InkHolePet.exe 即可，不再解压到 %TEMP%，绕开 Defender 拦截
      - name: Zip Windows dir
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: Compress-Archive -Path InkHolePet -DestinationPath InkHolePet-windows.zip

      # macOS: onedir → .app（BUNDLE 格式本身就是目录），zip 保留符号链接
      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        run: ditto -c -k --sequesterRsrc --keepParent InkHolePet.app InkHolePet-macos.zip

      - name: Create signed Windows update manifest
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 InkHolePet-windows.zip).Hash.ToLowerInvariant()
          $manifest = "InkHolePet-windows.zip.sha256.ps1"
          Set-Content -Encoding ascii $manifest "# INKHOLE-SHA256 $hash  InkHolePet-windows.zip"
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "inkhole-manifest-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw "Unable to import the Windows release certificate" }
            $signed = Set-AuthenticodeSignature -FilePath $manifest -Certificate $certificate `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            if ($signed.Status -ne "Valid") { throw "Manifest signing failed: $($signed.StatusMessage)" }
            $verified = Get-AuthenticodeSignature -LiteralPath $manifest
            if ($verified.Status -ne "Valid" -or $verified.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "Manifest signature verification failed"
            }
            Remove-Item -Force "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
            Remove-Item -Force $pfx
          }

      - name: Create macOS checksum
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        shell: bash
        run: shasum -a 256 InkHolePet-macos.zip > InkHolePet-macos.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.manifest }}

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Require the complete release asset set
        shell: bash
        run: |
          test -f release/InkHolePet-windows.zip
          test -f release/InkHolePet-windows.zip.sha256.ps1
          test -f release/InkHolePet-macos.zip
          test -f release/InkHolePet-macos.zip.sha256
          test "$(find release -maxdepth 1 -type f -name 'InkHole-v*.apk' | wc -l)" -eq 1

      - name: Publish complete Release
        uses: softprops/action-gh-release@v2
        with:
          name: InkHole ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/InkHolePet-windows.zip
            release/InkHolePet-windows.zip.sha256.ps1
            release/InkHolePet-macos.zip
            release/InkHolePet-macos.zip.sha256
            release/InkHole-v*.apk
