name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 推 v* tag 时自动发布桌面二进制到对应 Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: inkhole-pet-windows
            asset: packaging/dist/InkHolePet.exe
          - os: macos-latest
            artifact: inkhole-pet-macos
            asset: packaging/dist/InkHolePet-macos.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install PySide6 zeroconf cryptography pyinstaller
          pip install pyobjc-framework-Cocoa || true

      - name: Build
        working-directory: packaging
        run: pyinstaller inkhole-pet.spec --noconfirm --clean

      # 产物文件名用 ASCII(InkHolePet):GitHub Release 附件不支持非 ASCII 文件名,
      # 中文名上传后会被剥成 default.exe。界面/Finder 显示名仍是中文(见 spec/pet.py)。
      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        run: zip -r -y InkHolePet-macos.zip InkHolePet.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

      # 仅在 tag 推送时把二进制发布到对应 Release(名字已是 ASCII,不会被剥)
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
