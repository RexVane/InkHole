name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 推 v* tag 时自动发布桌面二进制到对应 Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: inkhole-pet-windows
            asset: packaging/dist/InkHolePet-windows.zip
          - os: macos-latest
            artifact: inkhole-pet-macos
            asset: packaging/dist/InkHolePet-macos.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install PySide6 zeroconf cryptography pyinstaller
          pip install pyobjc-framework-Cocoa || true

      - name: Build
        working-directory: packaging
        run: pyinstaller inkhole-pet.spec --noconfirm --clean

      # Windows: onedir 产物是文件夹，zip 打包后上传
      # 用户解压后双击 InkHolePet\InkHolePet.exe 即可，不再解压到 %TEMP%，绕开 Defender 拦截
      - name: Zip Windows dir
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: Compress-Archive -Path InkHolePet -DestinationPath InkHolePet-windows.zip

      # macOS: onedir → .app（BUNDLE 格式本身就是目录），zip 保留符号链接
      - name: Zip macOS app
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        run: zip -r -y InkHolePet-macos.zip InkHolePet.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.asset }}

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
