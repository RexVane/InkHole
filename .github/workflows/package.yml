name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

# A tag becomes a Release only after Windows, macOS and Android all pass.
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft Release for direct platform uploads
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "InkHole $RELEASE_TAG"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: inkhole-pet-windows
            asset: packaging/dist/InkHolePet-windows.zip
            manifest: packaging/dist/InkHolePet-windows.zip.sha256.ps1
          - os: macos-latest
            artifact: inkhole-pet-macos
            asset: packaging/dist/InkHolePet-macos.zip
            manifest: packaging/dist/InkHolePet-macos.zip.sha256

    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            transport-core/go.sum

      - name: Validate desktop release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PACKAGE_VERSION="$(PYTHONPATH=src python -c 'import inkhole; print(inkhole.__version__)')"
          DESKTOP_VERSION="$(sed -n 's/.*appVersion *= *"\([^"]*\)".*/\1/p' desktop/config.go | head -n 1)"
          BUILD_CONFIG_VERSION="$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' desktop/build/config.yml | head -n 1)"
          WINDOWS_VERSION="$(python -c 'import json; print(json.load(open("desktop/build/windows/info.json", encoding="utf-8"))["fixed"]["file_version"])')"
          MACOS_VERSION="$(python -c 'import plistlib; print(plistlib.load(open("desktop/build/darwin/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          test "$PROJECT_VERSION" = "$PACKAGE_VERSION"
          test "$PROJECT_VERSION" = "$DESKTOP_VERSION"
          test "$PROJECT_VERSION" = "$BUILD_CONFIG_VERSION"
          test "$PROJECT_VERSION" = "$WINDOWS_VERSION"
          test "$PROJECT_VERSION" = "$MACOS_VERSION"
          test "v$PROJECT_VERSION" = "$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG does not match desktop version v$PROJECT_VERSION" >&2
            exit 1
          }

      - name: Report Windows signing status
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        shell: bash
        run: |
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "Windows ZIP: Authenticode signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Windows ZIP: unsigned (no release certificate configured)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Windows release certificate is not configured; publishing an unsigned ZIP."
          fi

      - name: Report macOS signing status
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
        shell: bash
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            echo "macOS ZIP: Developer ID signed" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "macOS app: notarization enabled" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "macOS app: not notarized (Apple notarization credentials not configured)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "macOS ZIP: unsigned and not notarized (no release certificate configured)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::macOS release certificate is not configured; publishing an unsigned, unnotarized ZIP."
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/inkhole-signing.p12"
          keychain_path="$RUNNER_TEMP/inkhole-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          echo "INKHOLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build Wails desktop
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            wails3 task build
          else
            wails3 task package
          fi

      - name: Sign Windows executables
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "inkhole-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $targets = @("desktop\bin\InkHole.exe")
          foreach ($target in $targets) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $target" }
            & $signtool.FullName verify /pa /all $target
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $target" }
          }
          Remove-Item -Force $pfx

      - name: Sign macOS app
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          codesign --force --deep --options runtime --timestamp \
            --keychain "$INKHOLE_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" desktop/bin/InkHole.app
          codesign --verify --deep --strict --verbose=2 desktop/bin/InkHole.app

      - name: Notarize and staple macOS app
        if: >-
          runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != '' &&
          env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          ditto -c -k --keepParent desktop/bin/InkHole.app "$RUNNER_TEMP/InkHole-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/InkHole-notary.zip" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple desktop/bin/InkHole.app
          xcrun stapler validate desktop/bin/InkHole.app
          spctl --assess --type execute --verbose=4 desktop/bin/InkHole.app

      # Keep the historical asset names so existing update checks continue to work.
      - name: Zip Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\dist | Out-Null
          Compress-Archive -Path desktop\bin\InkHole.exe -DestinationPath packaging\dist\InkHolePet-windows.zip

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p packaging/dist
          ditto -c -k --sequesterRsrc --keepParent desktop/bin/InkHole.app packaging/dist/InkHolePet-macos.zip

      - name: Create Windows update manifest
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 InkHolePet-windows.zip).Hash.ToLowerInvariant()
          $manifest = "InkHolePet-windows.zip.sha256.ps1"
          Set-Content -Encoding ascii $manifest "# INKHOLE-SHA256 $hash  InkHolePet-windows.zip"
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "inkhole-manifest-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw "Unable to import the Windows release certificate" }
            $signed = Set-AuthenticodeSignature -FilePath $manifest -Certificate $certificate `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            if ($signed.Status -ne "Valid") { throw "Manifest signing failed: $($signed.StatusMessage)" }
            $verified = Get-AuthenticodeSignature -LiteralPath $manifest
            if ($verified.Status -ne "Valid" -or $verified.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "Manifest signature verification failed"
            }
            Remove-Item -Force "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
            Remove-Item -Force $pfx
          }

      - name: Create macOS checksum
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        shell: bash
        run: shasum -a 256 InkHolePet-macos.zip > InkHolePet-macos.zip.sha256

      - name: Upload desktop files directly to draft Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" "${{ matrix.manifest }}" --clobber

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.manifest }}
          retention-days: 1

  android:
    needs: prepare-release
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          for REQUIRED in \
            InkHolePet-windows.zip \
            InkHolePet-windows.zip.sha256.ps1 \
            InkHolePet-macos.zip \
            InkHolePet-macos.zip.sha256 \
            "InkHole-$RELEASE_TAG.apk" \
            "InkHole-$RELEASE_TAG-arm64-v8a.apk" \
            "InkHole-$RELEASE_TAG-armeabi-v7a.apk" \
            "InkHole-$RELEASE_TAG-x86_64.apk"; do
            grep -Fxq "$REQUIRED" <<<"$ASSETS" || {
              echo "Missing release asset: $REQUIRED" >&2
              exit 1
            }
          done

      - name: Publish complete Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: InkHole ${{ env.RELEASE_TAG }}
          draft: false
          body: |
            InkHole ${{ env.RELEASE_TAG }} 重点改善局域网设备发现速度、换网响应和离线判定稳定性。

            - 主动发现：Go 核心补充主动 mDNS 查询，桌面窗口回到前台时立即刷新，不再只等待系统被动回调。
            - 换网响应：Wi-Fi 或本机地址变化后立即重新宣告和查询；已经离开当前子网的设备及时下线，仍有可用路由的设备保留省电容忍。
            - 离开通知：Windows、macOS、Android 和 Python 兼容栈统一使用可验证的 goodbye 流程，防止伪造通知、超时误删和通知洪水。
            - 多地址探测：保留全部候选地址并限制并发量，可达地址排在第 9 个以后也能被发现，快速地址不会被慢地址阻塞。
            - 网卡识别：修复 Windows `Local Area Connection` 等物理网卡被误判为回环或虚拟网卡的问题。
            - 质量保障：新增换网延迟、候选调度、goodbye 竞态与限流回归测试；后台测试线程异常现在会直接使测试失败。
            - Android：继续按 CPU 架构提供独立 APK，更新器会自动选择匹配设备的安装包。

            Android APK 使用项目固定发布密钥签名。Windows/macOS 提供 ZIP 与 SHA-256 校验文件；桌面签名和公证状态以本次构建结果为准。
          generate_release_notes: true
