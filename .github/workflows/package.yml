name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "InkHole $RELEASE_TAG"

  desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: nsis
          - os: macos-latest
            platform: macos
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0' --locked

      - name: Build Tauri bundle
        working-directory: rust/apps/inkhole-desktop
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/dist | Out-Null
          $bundle = Get-ChildItem rust/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Compress-Archive -Path $bundle.FullName -DestinationPath packaging/dist/InkHole-$env:RELEASE_TAG-windows.zip
          (Get-FileHash -Algorithm SHA256 packaging/dist/InkHole-$env:RELEASE_TAG-windows.zip).Hash.ToLowerInvariant() |
            Set-Content -Encoding ascii packaging/dist/InkHole-$env:RELEASE_TAG-windows.zip.sha256

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p packaging/dist
          dmg=$(find rust/target/release/bundle/dmg -name '*.dmg' -type f | head -n 1)
          cp "$dmg" "packaging/dist/InkHole-$RELEASE_TAG-macos.dmg"
          shasum -a 256 "packaging/dist/InkHole-$RELEASE_TAG-macos.dmg" > \
            "packaging/dist/InkHole-$RELEASE_TAG-macos.dmg.sha256"

      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" packaging/dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload workflow artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: inkhole-${{ matrix.platform }}
          path: packaging/dist/*

  android:
    needs: prepare-release
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    secrets: inherit

  ios:
    needs: prepare-release
    uses: ./.github/workflows/ios.yml
    with:
      release_tag: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    secrets: inherit

  publish:
    needs: [desktop, android, ios]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: InkHole ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
