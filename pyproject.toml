[project]
name = "inkhole"
version = "1.4.1"
description = "Cross-platform file transfer over LAN auto-discovery and direct IP connections."
requires-python = ">=3.10"

[project.optional-dependencies]
gui = ["PySide6", "zeroconf", "cryptography", "psutil"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
