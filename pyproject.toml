[project]
name = "wormhole"
version = "2.0.0"
description = "P2P LAN file transfer: drag files into a black-hole desktop pet, they appear on the other machine. mDNS auto-discovery, TCP direct, no server needed."
requires-python = ">=3.10"

[project.optional-dependencies]
gui = ["PySide6", "zeroconf", "cryptography"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
